<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4: Salario de empleado</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contenedor">
    <a class="volver" href="index.html">&larr; Volver al inicio</a>
    <h1>Ejercicio 4: Calcular el salario de un empleado</h1>
    <form>
      <p><label>Horas trabajadas: <input type="number" min="0" placeholder="Horas trabajadas"></label></p>
      <p><label>Valor por hora: <input type="number" min="0" placeholder="Valor por hora"></label></p>
      <p><button type="button" onclick="calcularSalario()">Calcular salario</button></p>
      <p><label>Salario a pagar: <input type="text" placeholder="Salario a pagar" readonly></label></p>
    </form>
  </main>
  <script src="js/scrips.js"></script>
</body>
</html>
