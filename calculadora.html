<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1: Calculadora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contenedor">
    <a class="volver" href="index.html">&larr; Volver al inicio</a>
    <h1>Ejercicio 1: Calculadora de dos números</h1>
    <form>
      <p><label>Número 1: <input type="number" placeholder="Número 1" id="n1"></label></p>
      <p><label>Número 2: <input type="number" placeholder="Número 2" id="n2"></label></p>
      <p class="botones">
        <button type="button" onclick="sumar()">Sumar</button>
        <button type="button" onclick="restar()">Restar</button>
        <button type="button" onclick="multiplicar()">Multiplicar</button>
        <button type="button" onclick="dividir()">Dividir</button>
      </p>
      <p><label>Resultado: <input type="text" placeholder="Resultado" readonly id="resultado"></label></p>
    </form>
  </main>
  <script src="js/scrips.js"></script>
</body>
</html>
