<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3: Promedio de notas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contenedor">
    <a class="volver" href="index.html">&larr; Volver al inicio</a>
    <h1>Ejercicio 3: Calcular el promedio de 3 notas</h1>
    <form>
      <p><label>Nota 1: <input type="number" step="0.1" min="0" max="5" placeholder="Nota 1"></label></p>
      <p><label>Nota 2: <input type="number" step="0.1" min="0" max="5" placeholder="Nota 2"></label></p>
      <p><label>Nota 3: <input type="number" step="0.1" min="0" max="5" placeholder="Nota 3"></label></p>
      <p><button type="button" onclick="calcularPromedio()">Calcular promedio</button></p>
      <p><label>Promedio: <input type="text" placeholder="Promedio" readonly></label></p>
    </form>
  </main>
  <script src="js/scrips.js"></script>
</body>
</html>
